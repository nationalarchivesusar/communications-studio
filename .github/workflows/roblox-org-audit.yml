name: Roblox organization audit

on:
  push:
    paths:
      - '.github/workflows/roblox-org-audit.yml'
      - 'scripts/roblox_org_audit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run recursive Roblox ally/role audit
        run: python3 scripts/roblox_org_audit.py

      - name: Save audit snapshot in repository
        run: |
          mkdir -p data
          cp audit-output/roblox-org-audit.json data/roblox-org-audit.json
          cp audit-output/roblox-org-audit.md data/roblox-org-audit.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roblox-org-audit.json data/roblox-org-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "Update Roblox organization audit"
            git push
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: roblox-org-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 1
