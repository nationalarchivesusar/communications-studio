name: Frontend auth checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'config.js'
      - 'auth-ui.js'
      - 'app-13.js'
      - '.github/workflows/frontend-auth-check.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'auth-ui.js'
      - 'app-13.js'
      - '.github/workflows/frontend-auth-check.yml'

permissions:
  contents: read

jobs:
  syntax:
    name: Validate login JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse runtime configuration
        run: node --check config.js
      - name: Parse authentication UI
        run: node --check auth-ui.js
      - name: Parse boot/session logic
        run: node --check app-13.js
      - name: Verify GitHub Pages production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const COMMUNICATIONS_STUDIO_PRODUCTION_API = "https://ray-optiplex.tail6f3caa.ts.net:10000";' config.js
          grep -Fq 'location.hostname === COMMUNICATIONS_STUDIO_BACKEND_HOST' config.js
          grep -Fq '? location.origin' config.js
          ! grep -Fq 'location.replace(' index.html
      - name: Verify cross-site OAuth session handoff
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const prefix = "#cs_auth=";' auth-ui.js
          grep -Fq 'localStorage.setItem(STUDIO_API_SESSION_KEY, token)' auth-ui.js
          grep -Fq 'headers.set("Authorization", `Bearer ${token}`)' auth-ui.js
          grep -Fq 'clearStudioApiSessionToken();' auth-ui.js
      - name: Verify auth scripts load in dependency order
        shell: bash
        run: |
          set -euo pipefail
          auth_line=$(grep -n 'src="./auth-ui.js' index.html | cut -d: -f1)
          app13_line=$(grep -n 'src="./app-13.js' index.html | cut -d: -f1)
          test -n "$auth_line" -a -n "$app13_line"
          test "$auth_line" -lt "$app13_line"
